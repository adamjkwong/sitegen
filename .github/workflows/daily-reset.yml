name: Daily Portfolio Reset

on:
  schedule:
    # 11:30 PM PT is 06:30 AM UTC (during Daylight Savings)
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "SiteGen Bot"
          git config --global user.email "bot@sitegen.local"

      - name: Archive Daily Sites & Reset Landing Page
        run: |
          # 1. Archive any sites from the generated-sites folder
          DATE_STR=$(date +'%Y%m%d')
          
          # Check if there are any folders to move (excluding .gitkeep)
          if [ "$(ls -A generated-sites | grep -v '.gitkeep')" ]; then
            echo "New sites found. Archiving..."
            mkdir -p archive/$DATE_STR
            mv generated-sites/* archive/$DATE_STR/ 2>/dev/null || true
            # Restore the .gitkeep
            touch generated-sites/.gitkeep
          else
            echo "No new sites to archive."
          fi

          # 2. Check if index.html differs from template
          if ! cmp -s assets/landing-template.html index.html; then
            echo "index.html differs from template. Restoring..."
            cp assets/landing-template.html index.html
          else
            echo "index.html is already identical to template."
          fi
          
          # 3. Commit and Push ONLY if there are changes
          git add index.html archive/ generated-sites/
          
          if ! git diff --cached --quiet; then
            git commit -m "Daily Reset: Restored landing page and archived sites for $DATE_STR"
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi
